[package]
name = "iris-client"
version = "0.1.0"
edition = "2021"
description = "Async typed client for irisd, usable by CLI and web applications"

[features]
default = ["http", "udp"]
http = ["dep:reqwest", "dep:iris-api", "dep:serde_json"]
udp = ["dep:tokio"]
config = ["dep:toml", "dep:anyhow", "dep:serde"]

[dependencies]
iris-api = { optional = true, path = "../iris-api", version = "0.1.0" }
url = "2"
photon-protocol = { path = "../photon-protocol", version = "0.1.0" }
reqwest = { optional = true, version = "0.12", default-features = false, features = ["json"] }
serde_json = { version = "1", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
toml = { version = "0.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
