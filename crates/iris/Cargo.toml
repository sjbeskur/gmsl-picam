[package]
name = "gmsl-picam-rs"
version = "0.1.0"
edition = "2021"
description = "Rust examples for GMSL IMX477 camera on Raspberry Pi 5"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.7", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }

# libcamera direct bindings (example: libcamera_capture)
libcamera = { version = "0.7", optional = true }

# GStreamer bindings (example: gstreamer_capture)
gstreamer     = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[features]
default = []
iris-service = [
    "dep:axum",
    "dep:clap",
    "dep:libcamera",
    "http-support",
    "jpeg-support",
]
jpeg-support = ["dep:image"]
http-support = [
    "dep:axum",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-stream",
]
libcamera-example = ["dep:libcamera"]
gstreamer-example = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[[bin]]
name = "iris"
path = "src/bin/iris.rs"
required-features = ["iris-service"]

[[example]]
name = "libcamera_capture"
required-features = ["libcamera-example"]

[[example]]
name = "gstreamer_capture"
required-features = ["gstreamer-example"]
